<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="shortcut icon" href="../image/log-in.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .welcome-card {
            background: rgba(27, 27, 27, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .welcome-card h1 {
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .welcome-card p {
            color: #dbeafe;
            margin-bottom: 2rem;
        }

        .welcome-card .btn {
            width: 100%;
            margin-bottom: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                <div class="welcome-card">
                    <h1>Welcome</h1>
                    <p>Access your account or create a new one to continue.</p>

                    <a href="Pages/login.html" class="btn btn-success">Log In</a>
                    <a href="Pages/signin.html" class="btn btn-outline-light">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
