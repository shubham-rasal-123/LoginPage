<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./image/log-in.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>Login Form</title>
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">
                <form action="#" class="form-card shadow-lg text-white">
                    <div class="text-center mb-4">
                        <h2 class="form-title">Log In</h2>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label"><i class="fas fa-user me-2"></i>Email</label>
                        <input id="email" type="email" class="form-control" placeholder="Email">
                        <small class="form-text mt-2 d-block">We'll never share your email with anyone else.</small>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label"><i class="fas fa-key me-2"></i>Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Password">
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember Me</label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-3">Log In</button>
                    <a href="signin.html" class="btn btn-outline-light w-100">Create Account</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
